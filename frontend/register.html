<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro — Projeto MIRAI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;1,9..144,300;1,9..144,500&family=Manrope:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="config.js"></script>

<style>
  :root {
    --forest-deep:  #0E1916;
    --forest:       #1B2A26;
    --forest-line:  #3B4F49;
    --sage:         #7C9975;
    --sage-bright:  #A3C29A;
    --cream:        #EBE5D5;
    --cream-mute:   #8A9186;
    --error:        #D47474;
    --success:      #7C9975;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }

  body {
    background: var(--forest-deep);
    color: var(--cream);
    font-family: 'Manrope', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  nav {
    padding: 22px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: inherit;
  }

  .logo-mark { width: 32px; height: 32px; }

  .logo-text {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.5px;
  }
  .logo-text b { color: var(--sage); font-weight: 700; }

  .back {
    font-size: 13px;
    color: var(--cream-mute);
    text-decoration: none;
    transition: color 0.2s;
  }

  .back:hover { color: var(--sage-bright); }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px 80px;
  }

  .card {
    width: 100%;
    max-width: 420px;
  }

  .card-header {
    text-align: center;
    margin-bottom: 40px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-size: 38px;
    font-weight: 400;
    line-height: 1.1;
    letter-spacing: -1px;
    color: var(--cream);
    margin-bottom: 12px;
  }

  h1 em { font-style: italic; color: var(--sage); }

  .sub {
    color: var(--cream-mute);
    font-size: 14px;
    line-height: 1.6;
  }

  form { display: flex; flex-direction: column; gap: 18px; }

  .field {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .field label {
    font-size: 13px;
    color: var(--cream);
    font-weight: 500;
  }

  .input-wrap {
    position: relative;
  }

  input[type=email],
  input[type=password],
  input[type=text] {
    width: 100%;
    background: var(--forest);
    border: 1px solid var(--forest-line);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 14px;
    color: var(--cream);
    font-family: 'Manrope', sans-serif;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }

  input::placeholder {
    color: var(--cream-mute);
    opacity: 0.6;
  }

  input:focus {
    border-color: var(--sage);
    background: rgba(124,153,117,0.05);
  }

  .toggle-pass {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--cream-mute);
    cursor: pointer;
    font-size: 12px;
    font-family: 'Manrope', sans-serif;
    padding: 4px 8px;
    border-radius: 6px;
    transition: color 0.2s;
  }

  .toggle-pass:hover { color: var(--sage-bright); }

  .hint {
    font-size: 11px;
    color: var(--cream-mute);
    margin-top: 2px;
  }

  button[type=submit] {
    margin-top: 8px;
    padding: 14px 24px;
    background: var(--sage);
    color: var(--forest-deep);
    border: none;
    border-radius: 999px;
    font-weight: 600;
    font-size: 14px;
    font-family: 'Manrope', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  button[type=submit]:hover:not(:disabled) {
    background: var(--sage-bright);
    transform: translateY(-1px);
  }

  button[type=submit]:disabled { opacity: 0.7; cursor: wait; }

  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(14,25,22,0.3);
    border-top-color: var(--forest-deep);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }

  button.loading .spinner { display: block; }
  button.loading .label { display: none; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .msg {
    background: rgba(212,116,116,0.08);
    border: 1px solid rgba(212,116,116,0.25);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--error);
    display: none;
  }

  .msg.show { display: block; }

  .msg.ok {
    background: rgba(124,153,117,0.08);
    border-color: rgba(124,153,117,0.25);
    color: var(--success);
  }

  .card-footer {
    text-align: center;
    margin-top: 28px;
    font-size: 13px;
    color: var(--cream-mute);
  }

  .card-footer a {
    color: var(--sage-bright);
    text-decoration: none;
    font-weight: 500;
  }

  .card-footer a:hover { text-decoration: underline; }

  @media (max-width: 500px) {
    nav { padding: 18px 24px; }
    h1 { font-size: 32px; }
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">
    <img src="logo.png" class="logo-mark" alt="MIRAI">
    <div class="logo-text">PROJETO <b>MIRAI</b></div>
  </a>
  <a href="index.html" class="back">← Voltar</a>
</nav>

<main>
  <div class="card">

    <div class="card-header">
      <h1>Criar <em>conta.</em></h1>
      <p class="sub">Cadastre-se para acessar a plataforma.</p>
    </div>

    <form id="register-form" autocomplete="on">

      <div class="msg" id="msg"></div>

      <div class="field">
        <label for="name">Nome completo</label>
        <div class="input-wrap">
          <input type="text" id="name" name="name" placeholder="Seu nome" autocomplete="name" required>
        </div>
      </div>

      <div class="field">
        <label for="email">E-mail</label>
        <div class="input-wrap">
          <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" required>
        </div>
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required minlength="6">
          <button type="button" class="toggle-pass" onclick="togglePass()" id="toggle-btn">Mostrar</button>
        </div>
        <div class="hint">Use pelo menos 6 caracteres.</div>
      </div>

      <button type="submit" id="submit-btn">
        <span class="label">Criar conta →</span>
        <span class="spinner"></span>
      </button>

    </form>

    <div class="card-footer">
      Já tem conta? <a href="login.html">Entrar</a>
    </div>

  </div>
</main>

<script>
function togglePass() {
  const input = document.getElementById('password');
  const btn = document.getElementById('toggle-btn');
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = 'Ocultar';
  } else {
    input.type = 'password';
    btn.textContent = 'Mostrar';
  }
}

const form = document.getElementById('register-form');
const btn = document.getElementById('submit-btn');
const msg = document.getElementById('msg');

function mostrarErro(texto) {
  msg.textContent = texto;
  msg.classList.remove('ok');
  msg.classList.add('show');
}

function mostrarSucesso(texto) {
  msg.textContent = texto;
  msg.classList.remove('show');
  msg.classList.add('ok', 'show');
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.classList.remove('show');

  const name     = document.getElementById('name').value.trim();
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  btn.classList.add('loading');
  btn.disabled = true;

  try {
    const response = await fetch(window.API_BASE + '/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password })
    });

    const data = await response.json();

    if (response.ok && data.token) {
      localStorage.setItem('mirai_token', data.token);
      localStorage.setItem('mirai_user', JSON.stringify(data.user));
      mostrarSucesso('Conta criada! Redirecionando...');
      setTimeout(() => window.location.href = 'mirai.html', 800);
    } else {
      mostrarErro(data.error || 'Não foi possível criar a conta.');
      btn.classList.remove('loading');
      btn.disabled = false;
    }
  } catch (erro) {
    mostrarErro('Erro de conexão. Verifique se o backend está rodando.');
    btn.classList.remove('loading');
    btn.disabled = false;
  }
});
</script>

</body>
</html>
